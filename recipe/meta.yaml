{% set name = "opensarlab_lib" %}
{% set version = "0.0.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 12c9797215f99387e3197f34803c7e923a286859eb10a8e17160f5b55e79bdd2

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - asf_search
    - cartopy
    - gdal
    - hyp3_sdk
    - ipywidgets
    - matplotlib-base
    - numpy
    - pandas
    - pyproj
    - shapely
    - pyshp

test:
  imports:
    - opensarlab_lib
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ASFOpenSARlab/opensarlab-lib
  summary: A Python library to support ASF OpenSARlab's Jupyter Notebook repository https://github.com/ASFOpenSARlab/opensarlab-notebooks
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Alex-Lewandowski
    - jhkennedy
    - dgpalmieri
